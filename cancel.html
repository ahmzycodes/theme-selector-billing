<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Payment Cancelled</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    h2 {
      margin-bottom: 16px;
    }

    p {
      opacity: 0.85;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      background: #64748b;
      color: white;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .button:hover {
      background: #475569;
    }

    .footer {
      margin-top: 20px;
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Payment Cancelled ❌</h2>
    <p>
      Your subscription was not completed and no charges were made.<br><br>
      You can restart checkout anytime from the extension or your account.
    </p>

    <button class="button" onclick="closeWindow()">
      Close Window
    </button>

    <div class="footer">
      If this tab does not close automatically, you can close it manually.
    </div>
  </div>

  <script>
    // Attempt to close the window gracefully
    function closeWindow() {
      window.close();
    }

    // Optional: auto-close after 10 seconds
    setTimeout(() => {
      window.close();
    }, 10000);
  </script>

</body>
</html>
