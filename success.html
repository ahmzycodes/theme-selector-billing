<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Payment Success</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    h2 {
      margin-bottom: 16px;
    }

    p {
      opacity: 0.85;
      margin-bottom: 20px;
    }

    .footer {
      margin-top: 20px;
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Payment Successful 🎉</h2>
    <p id="status">
      Finalizing your subscription…
    </p>
    <div class="footer">
      You can safely close this window.
    </div>
  </div>

  <script type="module">
    // With verify-stripe-session deprecated, we only display a success message.
    // Webhooks are now fully responsible for updating the database and subscription state.
    const statusEl = document.getElementById("status");

    const params = new URLSearchParams(window.location.search);
    const session_id = params.get("session_id");

    if (!session_id) {
      statusEl.textContent = "Payment received. Your subscription will be activated shortly. You may close this page.";
    } else {
      statusEl.textContent = "Payment successful! Your subscription will be activated shortly via our secure webhook system.";
    }

    // Optional: Add a small delay with a friendly message to reassure users
    setTimeout(() => {
      statusEl.textContent += " ✅";
    }, 1500);
  </script>

</body>
</html>
